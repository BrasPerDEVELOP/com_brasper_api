# Base de datos: por defecto usa el contenedor "db". Para usar la misma DB que en local,
# en .env pon POSTGRES_HOST=IP_DE_TU_DB (ej. 213.199.44.2 o host.docker.internal si está en el host).

name: com_brasper

services:
  db:
    image: postgres:16-alpine
    container_name: com_brasper_db
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - brasper
    restart: unless-stopped

  api:
    build: .
    container_name: com_brasper_api
    ports:
      - "${API_PORT:-8590}:${API_PORT:-8590}"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Si .env tiene POSTGRES_HOST (ej. 213.199.44.2 o host.docker.internal), la API usa esa DB.
      # Si no, usa el contenedor "db".
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DEBUG: ${DEBUG:-False}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SECRET_KEY: ${SECRET_KEY}
      BRASPER_IA_SHARED_SECRET: ${BRASPER_IA_SHARED_SECRET:-}
      TOKEN_EXPIRATION_MINUTES: ${TOKEN_EXPIRATION_MINUTES:-1440}
      TOKEN_REFRESH_EXPIRATION_MINUTES: ${TOKEN_REFRESH_EXPIRATION_MINUTES:-2880}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      AUTH_MODE: ${AUTH_MODE:-dual}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY es obligatorio}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-com.brasper.api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-com.brasper.app}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-brasper_refresh_token}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-none}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS es obligatorio}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-["127.0.0.1/32","172.20.0.0/16"]}
      ROOT_PATH: ${ROOT_PATH:-}
      PUBLIC_URL: ${PUBLIC_URL:-https://apibras.finzeler.com}
      API_PORT: ${API_PORT:-8590}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      # Facturación electrónica (APISUNAT). Sin estas líneas el contenedor no ve las
      # variables del .env. Valores por defecto = los de Settings: módulo apagado.
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      BILLING_AUTO_ISSUE: ${BILLING_AUTO_ISSUE:-false}
      BILLING_COMMISSION_INCLUDES_IGV: ${BILLING_COMMISSION_INCLUDES_IGV:-true}
      BILLING_IGV_RATE: ${BILLING_IGV_RATE:-0.18}
      BILLING_START_DATE: ${BILLING_START_DATE:-}
      BILLING_SEND_CUSTOMER_EMAIL: ${BILLING_SEND_CUSTOMER_EMAIL:-false}
      BILLING_POLL_INTERVAL_SECONDS: ${BILLING_POLL_INTERVAL_SECONDS:-30}
      BILLING_PDF_FORMAT: ${BILLING_PDF_FORMAT:-A4}
      BILLING_SERIES_BOLETA: ${BILLING_SERIES_BOLETA:-B001}
      BILLING_SERIES_FACTURA: ${BILLING_SERIES_FACTURA:-F001}
      BILLING_ISSUER_RUC: ${BILLING_ISSUER_RUC:-20608550454}
      BILLING_ISSUER_NAME: ${BILLING_ISSUER_NAME:-BRASPER 21 S.A.C.}
      BILLING_ISSUER_TRADE_NAME: ${BILLING_ISSUER_TRADE_NAME:-brasper transferencias}
      BILLING_ISSUER_ADDRESS: ${BILLING_ISSUER_ADDRESS:-AV. AREQUIPA NRO. 2447 INT. 409}
      BILLING_ISSUER_UBIGEO: ${BILLING_ISSUER_UBIGEO:-150116}
      BILLING_ISSUER_DISTRICT: ${BILLING_ISSUER_DISTRICT:-LINCE}
      BILLING_ISSUER_PROVINCE: ${BILLING_ISSUER_PROVINCE:-LIMA}
      BILLING_ISSUER_DEPARTMENT: ${BILLING_ISSUER_DEPARTMENT:-LIMA}
      APISUNAT_BASE_URL: ${APISUNAT_BASE_URL:-https://back.apisunat.com}
      APISUNAT_ENVIRONMENT: ${APISUNAT_ENVIRONMENT:-development}
      APISUNAT_PERSONA_ID: ${APISUNAT_PERSONA_ID:-}
      APISUNAT_PERSONA_TOKEN: ${APISUNAT_PERSONA_TOKEN:-}
      APISUNAT_TIMEOUT_SECONDS: ${APISUNAT_TIMEOUT_SECONDS:-30}
      # Varias empresas emisoras (JSON con ruc, name, address, ubigeo, district,
      # persona_id y persona_token de cada una). Vacío = una sola empresa (vars de arriba).
      BILLING_ISSUERS: ${BILLING_ISSUERS:-[]}
      BILLING_DEFAULT_ISSUER_RUC: ${BILLING_DEFAULT_ISSUER_RUC:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - brasper
    restart: unless-stopped

networks:
  brasper:
    driver: bridge

volumes:
  postgres_data:
